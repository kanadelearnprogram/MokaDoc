spring:
  application:
    name: MokaDoc
  profiles:
    active: local
  # 排除 LangChain4j 的 AI Service 自动配置（项目通过 AiServiceFactory 手动管理）
  autoconfigure:
    exclude:
      - dev.langchain4j.spring.LangChain4jAutoConfig
  # ? ???? Session
  session:
    redis:
      # ??????JSON
      serializer: json
      flush-mode: on-save
    # session 30 ???
    timeout: 2592000
  # MySQL ???????????
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mokaDoc
    username: root
    password: 114514
  # Redis ????????
  data:
    redis:
      host: localhost
      port: 6379
      database: 4
      password:
      ttl: 3600
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 220MB

mybatis-flex:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000


# springdoc-openapi ??
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.kanade.backend.controller

# 文件上传配置
file:
  upload:
    dir: ./uploads/documents


  community:
    redis:
      host: localhost
      port: 6379

# Elasticsearch 向量存储配置
elasticsearch:
  host: localhost
  port: 9200
  scheme: http
  index-name: rag_documents

# RAG 进阶优化配置
rag:
  query-transformation:
    enabled: true
    type: multi_strategy          # compress | expand | multi_strategy
  routing:
    enabled: true
  reranking:
    enabled: true
    model: rrf              # rrf（内置免费）
    top-k: 50
  injection:
    template: standard      # standard | concise | analytical
  es:
    max-results: 50
    min-score: 0.60

  # 向量化增强配置
  embedding:
    enhancers: sliding-window, graph-entity   # 增强器：sliding-window | graph-entity | 留空禁用
    chunk-strategy: article-aware         # 分块策略：coarse | fine | dual | article-aware
    chunk:
      coarse-size: 2000
      coarse-overlap: 200
      fine-size: 200
      fine-overlap: 30
    signature-cache:
      enabled: true                            # 内容签名缓存，避免重复索引
    # Phase 3: 邻居块扩展（检索时自动引入命中 chunk 的相邻块）
    neighbor-expansion:
      enabled: true
      window: 2                                # ±1 个相邻块
    # Phase 4: Parent-Child 父子块解析（fine chunk 命中时引入父 coarse chunk）
    parent-child:
      enabled: true


